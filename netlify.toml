[build]
  command = "npm run build"
  # Where Next.js puts its finished website. Netlify must not publish the project's top folder instead.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner stops a build when a secret's value appears in the output. R2_PUBLIC_URL is the
  # public web address of the photos, written into the pages on purpose, so it is not a secret.
  SECRETS_SCAN_OMIT_KEYS = "R2_PUBLIC_URL"

# Netlify's own address for this site always exists and cannot be removed, so it forwards to the real
# domain. Visitors and search engines then only ever see https://anpinpathai.org.
[[redirects]]
  from = "https://anpinpathai.netlify.app/*"
  to = "https://anpinpathai.org/:splat"
  status = 301
  force = true

# Makes sure Netlify runs the Next.js server part, which answers every page of the website.
# Without it Netlify publishes only plain files, and every address shows Netlify's own "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"
